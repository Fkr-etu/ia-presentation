name: Course 01 visual QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright@1.56.1 install --with-deps chromium

      - name: Run visual QA
        run: npx playwright@1.56.1 test qa/visual

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: course-01-visual-qa
          path: |
            qa/visual-artifacts
            qa/visual-report
          if-no-files-found: warn
